blueprint:
  name: AirExchange
  description: >
    Automation for outside air exchange.  All measurements must be in same format (ie. don't mix celsius and farenheit.)

    **Version**: 2026.11.1
  domain: automation
  source_url: https://github.com/rwalker777/HA-Blueprints/blob/main/AirExchange.yaml
  homeassistant:
    min_version: 2024.6.0

  input:
    Outdoor:
      name: Outdoor temperature, humidity and air quality
      input:
        outdoor_temp_entity:
          name: Outdoor temperature
          description: Outdoor temperature source
          selector:
            entity:
              filter:
                - device_class: temperature
                #- domain: weather
        temp_start_delta:
          name: Outdoor temperature delta to indoor temperature for air exchange - starts/stop when outside this delta
          description: This delta prevents the fan from running when small temperature differential inside vs outside
          default: 3
          selector:
            number:
              min: 1
              max: 30
              unit_of_measurement: degree
        temp_stop_delta:
          name: >
            Outdoor temperature delta to indoor temperature to stop air exchange **must be lower than start**
          description: This delta stops the fans from running forever - set to zero for fans to always run
          default: 2
          selector:
            number:
              min: 0
              max: 30
              unit_of_measurement: degree
        # outdoor_humidity_entity:
        #   name: Outdoor humidity
        #   description: Outdoor humidity source
        #   selector:
        #     entity:
        #       - device_class: humidity
        #       - domain: weather
        outdoor_aqi:
          name: Outdoor air quality
          description: Outdoor air quality source
          default: []
          selector:
            entity:
              filter:
                - device_class: aqi
        outdoor_aqi_level:
          name: Outdoor air quality level
          description: Outdoor air quality maximum level - above this fresh air is disabled
          default: 151
          selector:
            number:
              min: 50
              max: 300
    Indoor:
      name: Indoor temperature, humidity and CO2
      input:
        fan_entity:
          name: Fan
          description: Entity to control Fan - can be a switch, fan
          selector:
            entity:
              domain:
                - fan
                - switch
        max_fan_runtime:
          name: Maximum time in hours for fan to run
          description: Failsafe to prevent fan from running indefinitely - set to zero to disable
          default: 8
          selector:
            number:
              min: 0
              max: 24
        enable_heating:
          name: Enable warming air exchange
          description: Allow bringing in warmer outdoor air when indoor temperature is below the lower limit
          default: true
          selector:
            boolean:
        indoor_temp:
          name: Indoor temperature
          description: Indoor temperature source
          selector:
            entity:
              filter:
                - device_class: temperature
        indoor_temp_upper:
          name: Indoor temperature upper limit
          description: Target temperature range upper limit
          default: 76
          selector:
            number:
              min: 0
              max: 100
              unit_of_measurement: degree
        indoor_temp_lower:
          name: Indoor temperature lower limit
          description: Target temperature range lower limit
          default: 72
          selector:
            number:
              min: 0
              max: 100
              unit_of_measurement: degree
        temp_hysteresis:
          name: Indoor temperature hysteresis
          description: Degrees past the upper/lower indoor temperature limit required before stopping the fan
          default: 0.5
          selector:
            number:
              min: 0
              max: 10
              step: 0.1
              unit_of_measurement: degree
        indoor_humidity_entity:
          name: Indoor humidity
          description: Indoor humidity source
          default: []
          selector:
            entity:
              filter:
                - device_class: humidity
        indoor_humidity_upper:
          name: Indoor humidity upper limit
          description: Target humidity range upper limit
          default: 65
          selector:
            number:
              min: 0
              max: 100
              unit_of_measurement: percentage
        indoor_co2:
          name: Indoor CO2
          description: Indoor CO2 source
          default: []
          selector:
            entity:
              filter:
                - device_class: carbon_dioxide
        indoor_co2_level:
          name: Indoor CO2 limit
          description: Indoor CO2 level that forces air circulation
          default: 1000
          selector:
            number:
              min: 0
              max: 2000

#############
mode: single
max_exceeded: silent

variables:
  max_fan_runtime: !input max_fan_runtime
  enable_heating: !input enable_heating
  indoor_co2_entity: !input indoor_co2
  indoor_co2_entity_is_valid: '{{ indoor_co2_entity is string and "." in indoor_co2_entity }}'
  aqi_entity: !input outdoor_aqi
  aqi_entity_is_valid: '{{ aqi_entity is string and "." in aqi_entity }}'
  aqi_level: !input outdoor_aqi_level
  indoor_humidity_entity: !input indoor_humidity_entity
  humidity_entity_is_valid: '{{ indoor_humidity_entity is string and "." in indoor_humidity_entity }}'
  indoor_humidity_level: !input indoor_humidity_upper
  outdoor_temp_entity: !input outdoor_temp_entity
  indoor_temp_entity: !input indoor_temp
  indoor_temp_upper: !input indoor_temp_upper
  indoor_temp_lower: !input indoor_temp_lower
  temp_start_delta: !input temp_start_delta
  temp_stop_delta: !input temp_stop_delta
  temp_hysteresis: !input temp_hysteresis

trigger_variables:
  outdoor_temp_entity: !input outdoor_temp_entity
  indoor_temp_entity: !input indoor_temp
  indoor_temp_upper: !input indoor_temp_upper
  indoor_temp_lower: !input indoor_temp_lower
  temp_start_delta: !input temp_start_delta
  temp_stop_delta: !input temp_stop_delta
  temp_hysteresis: !input temp_hysteresis
  enable_heating: !input enable_heating
  aqi_entity: !input outdoor_aqi
  aqi_entity_is_valid: '{{ aqi_entity is string and "." in aqi_entity }}'
  aqi_level: !input outdoor_aqi_level
  indoor_humidity_entity: !input indoor_humidity_entity
  humidity_entity_is_valid: '{{ indoor_humidity_entity is string and "." in indoor_humidity_entity }}'
  indoor_humidity_level: !input indoor_humidity_upper
  indoor_co2_entity: !input indoor_co2
  indoor_co2_entity_is_valid: '{{ indoor_co2_entity is string and "." in indoor_co2_entity }}'

##### Triggers #####
trigger:
  - alias: TempCoolOn
    id: TempCoolOn
    platform: template
    value_template: >
      {% set indoor = states(indoor_temp_entity) | float('none') %}
      {% set outdoor = states(outdoor_temp_entity) | float('none') %}
      {% set aqi_val = states(aqi_entity) | float('none') if aqi_entity_is_valid else 'none' %}
      {% set above_aqi = aqi_val is number and aqi_val > (aqi_level | float(0)) %}
      {% set hum_val = states(indoor_humidity_entity) | float('none') if humidity_entity_is_valid else 'none' %}
      {% set above_humidity = hum_val is number and hum_val > (indoor_humidity_level | float(0)) %}
      {{
        indoor is number and outdoor is number
        and not above_aqi and not above_humidity
        and indoor > (indoor_temp_upper | float(0))
        and (indoor - outdoor) > (temp_start_delta | float(0))
      }}
    for:
      minutes: 2
  - alias: TempHeatOn
    id: TempHeatOn
    enabled: "{{ enable_heating }}"
    platform: template
    value_template: >
      {% set indoor = states(indoor_temp_entity) | float('none') %}
      {% set outdoor = states(outdoor_temp_entity) | float('none') %}
      {% set aqi_val = states(aqi_entity) | float('none') if aqi_entity_is_valid else 'none' %}
      {% set above_aqi = aqi_val is number and aqi_val > (aqi_level | float(0)) %}
      {% set hum_val = states(indoor_humidity_entity) | float('none') if humidity_entity_is_valid else 'none' %}
      {% set above_humidity = hum_val is number and hum_val > (indoor_humidity_level | float(0)) %}
      {{
        indoor is number and outdoor is number
        and not above_aqi and not above_humidity
        and indoor < (indoor_temp_lower | float(0))
        and (outdoor - indoor) > (temp_start_delta | float(0))
      }}
    for:
      minutes: 2
  - alias: 'CO2'
    id: 'CO2'
    enabled: "{{ indoor_co2_entity_is_valid }}"
    platform: numeric_state
    entity_id: !input indoor_co2
    above: !input indoor_co2_level
    # Wait 5 minuetes to prevent a momentary change from triggering
    for:
      minutes: 5

##### Actions #####
action:
  choose:
    # If trigger was cool
    - conditions: '{{ trigger.id == ''TempCoolOn'' }}'
      alias: 'ActionCoolOn'
      sequence:
        - service: homeassistant.turn_on
          target:
            entity_id: !input fan_entity
        - wait_for_trigger:
            # Stop immediately if outdoor AQI or indoor humidity exceeds limit
            - platform: template
              value_template: >
                {% set aqi_val = states(aqi_entity) | float('none') if aqi_entity_is_valid else 'none' %}
                {% set above_aqi = aqi_val is number and aqi_val > (aqi_level | float(0)) %}
                {% set hum_val = states(indoor_humidity_entity) | float('none') if humidity_entity_is_valid else 'none' %}
                {% set above_humidity = hum_val is number and hum_val > (indoor_humidity_level | float(0)) %}
                {{ above_aqi or above_humidity }}
            # Stop once delta drops to temp_stop_delta or indoor cools past upper limit by temp_hysteresis
            - platform: template
              value_template: >
                {% set indoor = states(indoor_temp_entity) | float('none') %}
                {% set outdoor = states(outdoor_temp_entity) | float('none') %}
                {% if indoor is not number or outdoor is not number %}
                  true
                {% else %}
                  # Validate entities are available (not offline/disconnected)
                  {% set indoor_available = indoor_temp_entity not in states['not_available'] and indoor_temp_entity != 'unavailable' %}
                  {% set outdoor_available = outdoor_temp_entity not in states['not_available'] and outdoor_temp_entity != 'unavailable' %}
                  {%- if not indoor_available or not outdoor_available %}
                    true
                  {%- else %}
                    {% set stop_delta = temp_stop_delta | float(0) %}
                    {% set hyst = temp_hysteresis | float(0) %}
                    {% set upper = indoor_temp_upper | float(0) %}
                    # Stop if: delta drops below configured temp_stop_delta, OR indoor reached target, OR temperatures reversed (outdoor now warmer than indoor + delta)
                    {{ (indoor - outdoor) <= stop_delta or indoor <= (upper - hyst) or outdoor >= (indoor + temp_start_delta | float(0)) }}
                  {%- endif %}
                {% endif %}
              for:
                minutes: 1
          continue_on_timeout: true
          timeout:
            hours: "{{ max_fan_runtime | float(0) if max_fan_runtime | float(0) > 0 else 8760 }}"
            minutes: 0
            seconds: 0
            milliseconds: 0
        - service: homeassistant.turn_off
          target:
            entity_id: !input fan_entity

    # If trigger was heat
    - conditions: '{{ trigger.id == ''TempHeatOn'' }}'
      alias: 'ActionHeatOn'
      sequence:
        - service: homeassistant.turn_on
          target:
            entity_id: !input fan_entity
        - wait_for_trigger:
            # Stop immediately if outdoor AQI or indoor humidity exceeds limit
            - platform: template
              value_template: >
                {% set aqi_val = states(aqi_entity) | float('none') if aqi_entity_is_valid else 'none' %}
                {% set above_aqi = aqi_val is number and aqi_val > (aqi_level | float(0)) %}
                {% set hum_val = states(indoor_humidity_entity) | float('none') if humidity_entity_is_valid else 'none' %}
                {% set above_humidity = hum_val is number and hum_val > (indoor_humidity_level | float(0)) %}
                {{ above_aqi or above_humidity }}
            # Stop once delta drops to temp_stop_delta or indoor warms past lower limit by temp_hysteresis
            - platform: template
              value_template: >
                {% set indoor = states(indoor_temp_entity) | float('none') %}
                {% set outdoor = states(outdoor_temp_entity) | float('none') %}
                {% if indoor is not number or outdoor is not number %}
                  true
                {% else %}
                  # Validate entities are available (not offline/disconnected)
                  {% set indoor_available = indoor_temp_entity not in states['not_available'] and indoor_temp_entity != 'unavailable' %}
                  {% set outdoor_available = outdoor_temp_entity not in states['not_available'] and outdoor_temp_entity != 'unavailable' %}
                  {%- if not indoor_available or not outdoor_available %}
                    true
                  {%- else %}
                    {% set stop_delta = temp_stop_delta | float(0) %}
                    {% set hyst = temp_hysteresis | float(0) %}
                    {% set lower = indoor_temp_lower | float(0) %}
                    # Stop if: delta drops below configured temp_stop_delta, OR indoor reached target, OR temperatures reversed (outdoor now colder than indoor - delta)
                    {{ (outdoor - indoor) <= stop_delta or indoor >= (lower + hyst) or outdoor <= (indoor - temp_start_delta | float(0)) }}
                  {%- endif %}
                {% endif %}
              for:
                minutes: 1
          continue_on_timeout: true
          timeout:
            hours: "{{ max_fan_runtime | float(0) if max_fan_runtime | float(0) > 0 else 8760 }}"
            minutes: 0
            seconds: 0
            milliseconds: 0
        - service: homeassistant.turn_off
          target:
            entity_id: !input fan_entity

    # If CO2 above limit turn on until below for 1 minute ignoring air quality
    # - conditions: '{{ trigger.id == ''CO2'' }}'
    #   alias: 'CO2High'
    #   sequence:
    #     - variables:
    #         co2_level: !input indoor_co2_level
    #     - service: switch.turn_on
    #       target:
    #         entity_id: !input fan_entity
    #     - wait_for_trigger:
    #         - platform: numeric_state
    #           entity_id:
    #             - !input indoor_co2
    #           below: !input indoor_co2_level
    #       timeout:
    #         hours: "{{ max_fan_runtime | float(0) }}"
    #         minutes: 0
    #         seconds: 0
    #         milliseconds: 0
    #     - service: switch.turn_off
    #       target:
    #         entity_id: !input fan_entity
